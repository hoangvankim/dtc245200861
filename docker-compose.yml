services:
  web-app:
    build: .
    container_name: web-app
    restart: always
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=job_board
    depends_on:
      - mysql-db
    networks:
      - job-network

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=job_board
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - job-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    expose:
      - "80"
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql-db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - mysql-db
    networks:
      - job-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-app
      - phpmyadmin
    networks:
      - job-network

  # --- Monitoring Services (Commit 2) ---
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx-proxy:80/stub_status
    depends_on:
      - nginx
    networks:
      - job-network

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: always
    environment:
      - MYSQLD_EXPORTER_PASSWORD=rootpassword
    command:
      - "--mysqld.username=root"
      - "--mysqld.address=mysql-db:3306"
    depends_on:
      - mysql-db
    networks:
      - job-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - job-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - job-network

volumes:
  db_data:
  grafana_data:

networks:
  job-network:
    driver: bridge
