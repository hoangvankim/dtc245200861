services:
  # --- Ứng Dụng Web Tuyển Dụng (Hardening: Non-root user) ---
  web-app:
    build: .
    container_name: web-app
    restart: always
    expose:
      - "3000"
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=job_board
    depends_on:
      - mysql-db
    networks:
      - frontend-net
      - backend-net

  # --- Cơ Sở Dữ Liệu MySQL (Hardening: Network Isolation) ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=job_board
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-net

  # --- Công Cụ Quản Lý DB: phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql-db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - mysql-db
    networks:
      - frontend-net
      - backend-net

  # --- Nginx Reverse Proxy (Commit 1: HTTPS & Security Headers) ---
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web-app
      - phpmyadmin
    networks:
      - frontend-net
      - monitoring-net

  # --- Hệ Thống Giám Sát (Commit 2: Prometheus & Grafana) ---
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx-proxy:80/stub_status
    depends_on:
      - nginx
    networks:
      - monitoring-net

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: always
    environment:
      - MYSQLD_EXPORTER_PASSWORD=rootpassword
    command:
      - "--mysqld.username=root"
      - "--mysqld.address=mysql-db:3306"
    depends_on:
      - mysql-db
    networks:
      - backend-net
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  # --- Hệ Thống Log Tập Trung (Commit 3: Loki & Promtail) ---
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ./logs/nginx:/var/log/nginx:ro
      - ./logs/app:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring-net

volumes:
  db_data:
  grafana_data:

# Hardening: Phân tách mạng (Network Isolation)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge
