global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mysql-database'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'nginx-webserver'
    static_configs:
      - targets: ['nginx-exporter:9113']
